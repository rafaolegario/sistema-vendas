<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Pedido</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('pedidos')}"></div>
<div class="container mt-5">
    <h2>Novo Pedido</h2>

    <form th:action="@{/pedidos/novo}" th:object="${pedido}" method="post">

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
            <div th:each="erro : ${#fields.globalErrors()}" th:text="${erro}"></div>
        </div>

        <div class="mb-3">
            <label for="cliente" class="form-label">Cliente</label>
            <select class="form-select" id="cliente" th:field="*{cliente.id}">
                <option value="">Selecione o cliente...</option>
                <option th:each="cliente : ${clientes}" th:value="${cliente.id}"
                        th:text="${cliente.nomeCompleto} + ' - ' + ${cliente.cpf}"></option>
            </select>
            <div class="text-danger" th:if="${#fields.hasErrors('cliente')}" th:errors="*{cliente}"></div>
        </div>

        <h5 class="mt-4">Produtos</h5>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th style="width: 60%">Produto</th>
                <th style="width: 25%">Quantidade</th>
                <th style="width: 15%"></th>
            </tr>
            </thead>
            <tbody id="itens">
            <tr th:each="item, iter : *{itens}">
                <td>
                    <select class="form-select" th:field="*{itens[__${iter.index}__].produto.id}">
                        <option value="">Selecione o produto...</option>
                        <option th:each="produto : ${produtos}" th:value="${produto.id}"
                                th:text="${produto.nome} + ' - ' + ${#numbers.formatCurrency(produto.preco)} + ' (estoque: ' + ${produto.quantidadeEmEstoque} + ')'"></option>
                    </select>
                </td>
                <td>
                    <input type="number" min="1" class="form-control"
                           th:field="*{itens[__${iter.index}__].quantidade}">
                </td>
                <td>
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerLinha(this)">Remover</button>
                </td>
            </tr>
            </tbody>
        </table>

        <button type="button" class="btn btn-secondary btn-sm mb-4" onclick="adicionarLinha()">Adicionar Produto</button>

        <div>
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a th:href="@{/pedidos}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>

    <p class="text-muted mt-3">
        A data/hora, o valor total e o status <strong>Ativo</strong> são definidos automaticamente ao salvar.
    </p>
</div>

<!-- Modelo de linha usado pelo botão "Adicionar Produto" -->
<template id="modeloLinha">
    <tr>
        <td>
            <select class="form-select" name="itens[__IDX__].produto.id">
                <option value="">Selecione o produto...</option>
                <option th:each="produto : ${produtos}" th:value="${produto.id}"
                        th:text="${produto.nome} + ' - ' + ${#numbers.formatCurrency(produto.preco)} + ' (estoque: ' + ${produto.quantidadeEmEstoque} + ')'"></option>
            </select>
        </td>
        <td>
            <input type="number" min="1" class="form-control" name="itens[__IDX__].quantidade" value="1">
        </td>
        <td>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="removerLinha(this)">Remover</button>
        </td>
    </tr>
</template>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
<script>
    // Cada linha nova recebe o próximo índice; índices vagos deixados por
    // remoções chegam ao controller como linhas em branco e são descartados lá.
    let proximoIndice = document.querySelectorAll('#itens tr').length;

    function adicionarLinha() {
        const modelo = document.getElementById('modeloLinha').innerHTML;
        document.getElementById('itens')
            .insertAdjacentHTML('beforeend', modelo.replaceAll('__IDX__', proximoIndice++));
    }

    function removerLinha(botao) {
        const corpo = document.getElementById('itens');
        if (corpo.rows.length === 1) {
            alert('O pedido deve ter pelo menos um produto.');
            return;
        }
        botao.closest('tr').remove();
    }
</script>
</body>
</html>
