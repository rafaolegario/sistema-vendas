<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Pedidos</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('pedidos')}"></div>
<div class="container mt-4">
    <h1>Pedidos</h1>
    <a class="btn btn-primary mb-3" th:href="@{/pedidos/novo}">Novo Pedido</a>

    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <table class="table table-bordered table-striped">
        <thead class="table-dark">
        <tr>
            <th>Data/Hora</th>
            <th>Cliente</th>
            <th>Produtos</th>
            <th>Valor Total</th>
            <th>Status</th>
            <th>Ações</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pedido : ${pedidos}">
            <td th:text="${#temporals.format(pedido.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${pedido.cliente.nomeCompleto}"></td>
            <td>
                <span th:each="item : ${pedido.itens}" class="d-block"
                      th:text="${item.quantidade} + 'x ' + ${item.produto.nome}"></span>
            </td>
            <td th:text="${#numbers.formatCurrency(pedido.valorTotal)}"></td>
            <td>
                <span class="badge" th:classappend="${pedido.ativo} ? 'bg-success' : 'bg-secondary'"
                      th:text="${pedido.status.descricao}"></span>
            </td>
            <td>
                <a class="btn btn-sm btn-warning" th:if="${pedido.ativo}"
                   th:href="@{/pedidos/edit/{id}(id=${pedido.id})}">Alterar</a>
                <a class="btn btn-sm btn-danger" th:if="${pedido.ativo}"
                   th:href="@{/pedidos/cancel/{id}(id=${pedido.id})}">Cancelar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
