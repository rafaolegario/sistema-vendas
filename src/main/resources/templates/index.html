<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Vendas</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar('')}"></div>
<div class="container mt-4">
    <h1>Sistema de Vendas</h1>
    <p class="text-muted">Escolha um módulo para começar.</p>

    <div class="row g-3">
        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Produtos</h5>
                    <p class="card-text">Cadastro de produtos, preços e estoque.</p>
                    <a class="btn btn-primary" th:href="@{/produtos}">Acessar</a>
                </div>
            </div>
        </div>
        <div class="col-md-4" sec:authorize="hasRole('ADMIN')">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Clientes</h5>
                    <p class="card-text">Cadastro de clientes e endereços.</p>
                    <a class="btn btn-primary" th:href="@{/clientes}">Acessar</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title">Pedidos</h5>
                    <p class="card-text">Registro, alteração e cancelamento de pedidos.</p>
                    <a class="btn btn-primary" th:href="@{/pedidos}">Acessar</a>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
