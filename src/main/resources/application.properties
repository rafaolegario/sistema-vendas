spring.application.name=sistema-vendas

# Porta definida pelo Render (PORT); localmente usa 8080
server.port=${PORT:8080}

# Banco via variáveis de ambiente; os padrões batem com o docker-compose local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_vendas}
spring.datasource.username=${DB_USERNAME:usuario}
spring.datasource.password=${DB_PASSWORD:senha123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Moeda e datas sempre em pt-BR (R$ 1.500,00), independente do idioma do navegador
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed
